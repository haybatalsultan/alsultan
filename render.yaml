services:
  - type: web
    name: haybat-al-sultan
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --workers 4 --threads 2 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: AUDIT_LOG_SIGNING_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: haybat-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: haybat-security-cache
          type: keyvalue
          property: connectionString

  # Shared security cache for rate-limit counters across all Gunicorn workers.
  # Persistence is unnecessary for short-lived throttling windows.
  - type: keyvalue
    name: haybat-security-cache
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: haybat-db
    databaseName: haybatalsultan
    user: haybatalsultan
